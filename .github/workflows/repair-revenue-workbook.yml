name: Repair and verify revenue cycle workbook
on:
  workflow_dispatch:
  push:
    branches: [recruiter-directory-review-2026-10]
    paths: ['.github/workflows/repair-revenue-workbook.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recruiter-directory-review-2026-10
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calculation and inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc >/dev/null
          python -m pip install -q openpyxl
      - name: Recalculate and independently verify existing source
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          p=Path('evidence/Revenue_Cycle_Visibility_Tracker_Kori_Pickle.xlsx')
          w=load_workbook(p)
          assert len(w.sheetnames)==5,w.sheetnames
          assert sum(c.data_type=='f' for s in w for row in s for c in row)==36
          s=w['Claim Tracker']
          values=[r for r in s.iter_rows(min_row=2,values_only=True) if r[0]]
          assert len(values)==15,len(values)
          statuses=[str(r[4]).strip().lower() for r in values]
          roots=[str(r[5]).strip().lower() for r in values]
          days=[float(r[10]) for r in values]
          assert statuses.count('denied')==5,statuses
          assert roots.count('clean claim')==3,roots
          assert abs(sum(days)/len(days)-20.2)<0.000001,days
          print('PASS source: 15 simulated claims; 5 denied; 3 clean; 20.2 avg A/R days; 36 formulas')
          PY
          mkdir -p /tmp/recalculated
          libreoffice -env:UserInstallation=file:///tmp/lo-revenue-cycle --headless --convert-to xlsx --outdir /tmp/recalculated evidence/Revenue_Cycle_Visibility_Tracker_Kori_Pickle.xlsx
          test -s /tmp/recalculated/Revenue_Cycle_Visibility_Tracker_Kori_Pickle.xlsx
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          from zipfile import ZipFile
          p=Path('/tmp/recalculated/Revenue_Cycle_Visibility_Tracker_Kori_Pickle.xlsx')
          with ZipFile(p) as z: assert z.testzip() is None
          w=load_workbook(p,data_only=False)
          v=load_workbook(p,data_only=True)
          assert len(w.sheetnames)==5
          fs=[(s.title,c.coordinate) for s in w for row in s for c in row if c.data_type=='f']
          assert len(fs)==36,len(fs)
          assert all(v[s][coord].value is not None for s,coord in fs),[(s,coord) for s,coord in fs if v[s][coord].value is None]
          assert all(c.data_type!='e' for s in v for row in s for c in row)
          d=v['Dashboard']
          assert int(d['A5'].value)==15,d['A5'].value
          assert abs(float(d['C5'].value)-5/15)<0.000001,d['C5'].value
          assert abs(float(d['E5'].value)-3/15)<0.000001,d['E5'].value
          assert abs(float(d['G5'].value)-20.2)<0.000001,d['G5'].value
          print('PASS repaired: ZIP CRC, 5 sheets, 36 formulas and caches, 0 errors, all 4 dashboard metrics')
          PY
          cp /tmp/recalculated/Revenue_Cycle_Visibility_Tracker_Kori_Pickle.xlsx evidence/Revenue_Cycle_Visibility_Tracker_Kori_Pickle.xlsx
      - name: Commit verified Excel artifact to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/Revenue_Cycle_Visibility_Tracker_Kori_Pickle.xlsx
          if ! git diff --cached --quiet; then
            git commit -m 'Repair cached Excel formulas in verified revenue cycle evidence'
            git push origin HEAD:recruiter-directory-review-2026-10
          fi
